[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback so /admin, /join and /display work when visited directly or
# refreshed (React Router handles the actual route matching client-side).
# Netlify always serves actual function requests (/.netlify/functions/*)
# before applying this catch-all, so functions are unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
