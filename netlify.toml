[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so /admin, /join and /display work when visited directly or
# refreshed (React Router handles the actual route matching client-side).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
